<!DOCTYPE html>
<html lang="en" class="skin-calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>sprint</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1013'/%3E%3Crect x='12' y='40' width='40' height='4' rx='2' fill='%23d8a45c'/%3E%3Crect x='12' y='28' width='28' height='4' rx='2' fill='%237fa88a'/%3E%3Crect x='12' y='16' width='18' height='4' rx='2' fill='%235c4a4c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<script>
/* The skin, before the first paint. app.js is a module and therefore deferred,
   so reading `sprint.skin` there would show one Calm frame on a Chaos board.
   skin.js reads the same key and stays the owner of the setting; this is only
   the head start. */
try {
  var s = localStorage.getItem('sprint.skin');
  if (s === 'chaos') document.documentElement.className = 'skin-chaos';
} catch (e) {}
</script>
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar">
    <!-- plain <h1> on a one-sprint machine; siblings.js swaps in the switcher
         when the registry says another board is up (see /api/siblings) -->
    <div class="title-wrap menu-wrap" id="title-wrap">
      <h1 class="sprint-name" id="sprint-title">loading…</h1>
    </div>
    <p class="headline" id="headline"></p>
    <span class="grow"></span>
    <!-- quiet by design: dispatch policy is something you visit twice a month -->
    <button class="btn ghost settings-btn" id="settings-btn" type="button"
            title="model policy, executors, how many agents run at once">Settings</button>
    <div class="seg" id="skin-seg" role="group" aria-label="skin">
      <button class="seg-btn" type="button" data-skin="calm" aria-pressed="true">Calm</button>
      <button class="seg-btn" type="button" data-skin="chaos" aria-pressed="false">Chaos</button>
    </div>
    <div class="seg" id="view-seg" role="group" aria-label="layout">
      <button class="seg-btn" type="button" data-view="list">List</button>
      <button class="seg-btn" type="button" data-view="board">Board</button>
    </div>
    <button class="btn drop-btn" id="drop-btn" type="button">+ Drop work</button>
    <button class="btn chat-btn" id="chat-btn" type="button" aria-pressed="false">
      <span class="dot" id="chat-dot" aria-hidden="true"></span>
      <span>Chat</span>
    </button>
  </header>

  <div class="banner-slot" id="banner-slot" hidden>
    <div class="banner" id="banner"></div>
  </div>

  <main class="main" id="main" aria-label="board"></main>

  <aside class="rail" id="rail" aria-label="session chat or card thread"></aside>

</div>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet-wrap" id="compose-wrap" hidden>
  <form class="sheet compose" id="compose" autocomplete="off">
    <textarea id="compose-text" rows="4" placeholder="Drop work here — a bug, an idea, a screenshot."></textarea>
    <div class="thumbs" id="compose-thumbs" hidden></div>
    <div class="compose-row">
      <label class="switch" title="New items land in Held until you say go">
        <input type="checkbox" id="hold-toggle">
        <span class="switch-track"><span class="switch-knob"></span></span>
        <span class="switch-label">Hold new items</span>
      </label>
      <span class="grow"></span>
      <span class="compose-err" id="compose-err" hidden></span>
      <label class="btn ghost" for="compose-file">Images</label>
      <input type="file" id="compose-file" multiple accept="image/*" hidden>
      <button class="btn ghost" id="compose-cancel" type="button">Cancel</button>
      <button class="btn send" id="compose-send" type="submit">Send</button>
    </div>
    <p class="compose-hint">Return sends · Shift+Return for a new line</p>
  </form>
</div>

<!-- the CRT. Chaos only (styles.css hides it in Calm), never in the way of a click -->
<div class="scanlines" id="scanlines" aria-hidden="true"></div>

<div class="lightbox" id="lightbox" hidden></div>
<div class="toasts" id="toasts"></div>
<div class="authwall" id="authwall" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
